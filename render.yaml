# Render Blueprint: free web service, no credit card needed. Database lives on Neon (free).
services:
  - type: web
    name: pushpak-invoice-api
    runtime: docker
    plan: free
    healthCheckPath: /actuator/health
    envVars:
      - key: JWT_SECRET
        generateValue: true          # Render creates a random secret
      - key: DATABASE_URL            # paste Neon's connection string as-is: postgresql://user:pass@host/db?sslmode=require
        sync: false
      - key: CORS_ORIGINS
        value: https://pushpak-invoice-dashboard.onrender.com
      - key: FORWARD_HEADERS
        value: native
